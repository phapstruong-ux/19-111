<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quà Tặng Siêu To Khổng Lồ Nè Píu ❤</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-void: #040106;
      --card-bg: rgba(20, 5, 12, 0.88);
      --card-border: rgba(255, 145, 190, 0.22);
      --pink-soft: #f6a6c1;
      --pink-bright: #ff4f9a;
      --pink-glow: rgba(255, 120, 175, 0.45);
      --text-main: #fff5f8;
      --text-muted: rgba(255, 224, 236, 0.84);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-void);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      touch-action: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }

    #canvas-container.dragging {
      cursor: grabbing;
    }

    #canvas-container.hover-sticker {
      cursor: pointer;
    }

    /* Intro Splash Overlay */
    #intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background:
        radial-gradient(circle at 50% 42%, rgba(92, 22, 54, 0.46) 0%, rgba(16, 4, 10, 0.94) 58%, #050104 100%);
      transition: opacity 0.95s cubic-bezier(0.22, 1, 0.36, 1), transform 0.95s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-y: auto;
    }

    #intro-overlay.hidden-out {
      opacity: 0;
      transform: scale(1.06);
      pointer-events: none;
    }

    .intro-card {
      width: 100%;
      max-width: 410px;
      padding: 30px 24px 28px;
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(24, 6, 14, 0.93) 0%, rgba(14, 4, 9, 0.97) 100%);
      border: 1px solid var(--card-border);
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.82),
        0 0 55px rgba(255, 79, 154, 0.16),
        inset 0 1px 0 rgba(255, 200, 220, 0.1);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      position: relative;
      animation: cardFloat 5s ease-in-out infinite;
    }

    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .intro-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: clamp(1.38rem, 4.4vw, 1.72rem);
      line-height: 1.24;
      letter-spacing: 0.01em;
      color: #ffffff;
      text-shadow: 0 0 24px rgba(255, 165, 205, 0.5);
    }

    /* Heart-shaped ring of ❤️ emojis around the intro photo */
    .heart-frame-stage {
      position: relative;
      width: 224px;
      height: 204px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2px 0;
    }

    .heart-icon-ring {
      position: absolute;
      inset: 0;
      pointer-events: none;
      animation: heartRingPulse 2.4s ease-in-out infinite;
    }

    @keyframes heartRingPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }

    .heart-emoji-node {
      position: absolute;
      font-size: 14px;
      line-height: 1;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 7px rgba(255, 65, 125, 0.85));
    }

    .intro-sticker-wrap {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #14050c;
      border: 2px solid rgba(255, 165, 205, 0.72);
      box-shadow: 0 0 24px rgba(255, 79, 154, 0.45);
      transform: translateY(-4px);
    }

    .intro-sticker-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 22%;
    }

    .intro-subtitle {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 214, 230, 0.82);
      line-height: 1.5;
    }

    .enter-btn {
      margin-top: 2px;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 13px 26px;
      border-radius: 999px;
      background: linear-gradient(135deg, #f9b4cb 0%, #f18fb1 55%, #e678a0 100%);
      color: #fffafd;
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      box-shadow:
        0 0 28px rgba(244, 134, 176, 0.55),
        0 6px 20px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
    }

    .enter-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow:
        0 0 38px rgba(255, 120, 175, 0.75),
        0 10px 26px rgba(0, 0, 0, 0.5);
      filter: brightness(1.06);
    }

    .enter-btn:active {
      transform: scale(0.98);
    }

    /* Top Right Floating HUD */
    #hud-bar {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-btn {
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 160, 200, 0.22);
      background: rgba(20, 6, 14, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffe8f1;
      font-family: 'Inter', sans-serif;
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .hud-btn:hover {
      background: rgba(58, 16, 38, 0.85);
      border-color: rgba(255, 140, 190, 0.55);
      transform: translateY(-1px);
    }

    .hud-btn.icon-only {
      width: 36px;
      padding: 0;
    }

    .hud-btn.active {
      border-color: rgba(255, 110, 175, 0.75);
      box-shadow: 0 0 16px rgba(255, 79, 154, 0.35);
    }

    /* Bottom Hint */
    #galaxy-hint {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(18, 5, 12, 0.7);
      border: 1px solid rgba(255, 150, 195, 0.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 0.74rem;
      color: rgba(255, 225, 238, 0.88);
      letter-spacing: 0.02em;
      white-space: nowrap;
      max-width: calc(100vw - 24px);
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #galaxy-hint.visible {
      opacity: 1;
    }

    /* Memory Modal Card */
    #memory-modal {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(6, 1, 5, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    #memory-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .memory-card-shell {
      position: relative;
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(18px) scale(0.95);
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #memory-modal.open .memory-card-shell {
      transform: translateY(0) scale(1);
    }

    .memory-card {
      width: 100%;
      padding: 24px 20px 22px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(28, 7, 16, 0.95) 0%, rgba(15, 3, 9, 0.98) 100%);
      border: 1px solid rgba(255, 145, 190, 0.24);
      box-shadow:
        0 26px 70px rgba(0, 0, 0, 0.85),
        0 0 50px rgba(255, 79, 154, 0.2),
        inset 0 1px 0 rgba(255, 200, 225, 0.12);
      text-align: center;
      position: relative;
    }

    .memory-top-heart {
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #240814;
      border: 1px solid rgba(255, 150, 195, 0.38);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #ff8fb8;
      box-shadow: 0 0 14px rgba(255, 100, 165, 0.45);
    }

    .memory-img-frame {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 16px;
      overflow: hidden;
      background: #070205;
      border: 1px solid rgba(255, 160, 200, 0.16);
      box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.65), 0 8px 24px rgba(0, 0, 0, 0.5);
      margin-bottom: 16px;
      position: relative;
    }

    .memory-img-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 22%;
      display: block;
    }

    .memory-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: 1.38rem;
      color: #ffffff;
      margin-bottom: 8px;
      text-shadow: 0 0 18px rgba(255, 150, 195, 0.38);
    }

    .memory-text {
      font-size: 0.85rem;
      line-height: 1.62;
      color: var(--text-muted);
      max-width: 320px;
      margin: 0 auto 18px;
    }

    .memory-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .volver-btn {
      border: 1px solid rgba(255, 150, 195, 0.32);
      background: rgba(35, 9, 21, 0.85);
      color: #ffe6f0;
      padding: 9px 22px;
      border-radius: 999px;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .volver-btn:hover {
      background: rgba(78, 18, 45, 0.92);
      border-color: rgba(255, 130, 185, 0.68);
      box-shadow: 0 0 20px rgba(255, 79, 154, 0.38);
      transform: translateY(-1px);
    }

    .nav-arrow-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 150, 195, 0.24);
      background: rgba(28, 8, 18, 0.78);
      color: #ffd3e6;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .nav-arrow-btn:hover {
      background: rgba(78, 18, 45, 0.92);
      border-color: rgba(255, 130, 185, 0.6);
    }

    .memory-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .memory-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 180, 210, 0.25);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .memory-dot.active {
      background: #ff6aa8;
      transform: scale(1.3);
      box-shadow: 0 0 10px rgba(255, 106, 168, 0.7);
    }

    /* Speech Bubble Heart Badge below modal */
    .bubble-heart-badge {
      margin-top: 14px;
      width: 36px;
      height: 32px;
      border-radius: 50%;
      background: #ffffff;
      color: #e62e6b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      position: relative;
      box-shadow: 0 6px 20px rgba(255, 79, 154, 0.4);
      animation: badgePulse 2.2s ease-in-out infinite;
    }

    .bubble-heart-badge::after {
      content: '';
      position: absolute;
      bottom: -4px;
      right: 7px;
      width: 10px;
      height: 10px;
      background: #ffffff;
      transform: rotate(38deg);
      border-radius: 2px;
    }

    @keyframes badgePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @media (max-width: 480px) {
      .intro-card {
        padding: 24px 18px 22px;
      }
      .heart-frame-stage {
        width: 204px;
        height: 186px;
      }
      .intro-sticker-wrap {
        width: 98px;
        height: 98px;
      }
      .memory-card {
        padding: 20px 15px 18px;
      }
      #hud-bar {
        top: 10px;
        right: 10px;
        gap: 6px;
      }
      .hud-btn {
        height: 34px;
        font-size: 0.7rem;
        padding: 0 10px;
      }
    }
  </style>
</head>
<body>
  <!-- 3D WebGL Canvas Container -->
  <div id="canvas-container" aria-label="Vũ Trụ Tình Yêu Của Chồng Iu và Cục Vàngggg"></div>

  <!-- Top-Right Compact Controls -->
  <div id="hud-bar">
    <button id="lang-toggle" class="hud-btn" type="button" title="Đổi ngôn ngữ / Switch language">VI / EN</button>
    <button id="cards-toggle" class="hud-btn" type="button" title="Mở kỷ niệm / Open memories">💌 <span id="cards-btn-label">Kỷ niệm</span></button>
    <button id="music-toggle" class="hud-btn icon-only" type="button" aria-label="Âm nhạc" title="Âm nhạc">🔇</button>
    <button id="reset-cam" class="hud-btn icon-only" type="button" aria-label="Đặt lại góc nhìn" title="Đặt lại góc nhìn">↺</button>

  <!-- Intro Splash Overlay -->

      let audioCtx = null;

      const CHORDS = [
        [220.0, 261.63, 329.63, 392.0, 523.25],
        [174.61, 220.0, 261.63, 329.63, 440.0],
        [130.81, 196.0, 261.63, 329.63, 493.88],

      ];

      function initAudio() {
        if (audioCtx) return;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioCtx = new AudioContextClass();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.001;
        masterGain.connect(audioCtx.destination);
      }

      function playDreamyChord(freqs) {
        if (!audioCtx || !musicPlaying) return;
        const now = audioCtx.currentTime;
        freqs.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const filter = audioCtx.createBiquadFilter();

          osc.type = idx === 0 ? 'sine' : (idx % 2 === 0 ? 'triangle' : 'sine');
          osc.frequency.setValueAtTime(freq, now + idx * 0.14);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1100, now);

          gain.gain.setValueAtTime(0.0001, now + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(idx === 0 ? 0.08 : 0.045, now + idx * 0.14 + 0.45);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.14 + 3.4);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(masterGain);

          osc.start(now + idx * 0.14);
          osc.stop(now + idx * 0.14 + 3.5);
        });
      }

      function startMusic() {
        initAudio();
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        musicPlaying = true;
        masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGain.gain.linearRampToValueAtTime(0.32, audioCtx.currentTime + 0.8);
        document.getElementById('music-toggle').textContent = '🔊';
        document.getElementById('music-toggle').classList.add('active');

        if (musicTimer) clearInterval(musicTimer);
        playDreamyChord(CHORDS[chordStep % CHORDS.length]);
        chordStep++;
        musicTimer = setInterval(() => {
          if (!musicPlaying) return;
          playDreamyChord(CHORDS[chordStep % CHORDS.length]);
          chordStep++;
        }, 3200);
      }

      function stopMusic() {
        musicPlaying = false;
        if (musicTimer) {
          clearInterval(musicTimer);
          musicTimer = null;
        }
        if (audioCtx && masterGain) {
          masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
          masterGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
        }
        document.getElementById('music-toggle').textContent = '🔇';
        document.getElementById('music-toggle').classList.remove('active');
      }

      function playChime() {
        if (!audioCtx || !musicPlaying) return;
        const now = audioCtx.currentTime;
        [659.25, 880.0].forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          gain.gain.setValueAtTime(0.0001, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.06, now + i * 0.08 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.7);
          osc.connect(gain);
          gain.connect(masterGain);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.75);
        });
      }

      // ============================================================
      // 3. THREE.JS SCENE SETUP

      const container = document.getElementById('canvas-container');

      // ============================================================
      // 4. PROCEDURAL GLOW TEXTURES
      // ============================================================
      function createGlowDotTexture(innerColor, midColor) {
        const size = 64;
        const c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        const ctx = c.getContext('2d');
        const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
        g.addColorStop(0, innerColor || 'rgba(255,255,255,1)');
        g.addColorStop(0.28, midColor || 'rgba(255,120,185,0.85)');
        g.addColorStop(0.65, 'rgba(255,40,125,0.22)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);
        const tex = new THREE.CanvasTexture(c);
        tex.needsUpdate = true;
        return tex;
      }

      function createSoftHeartTexture() {
        const size = 128;
        const c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, size, size);

        const glow = ctx.createRadialGradient(64, 64, 8, 64, 64, 60);
        glow.addColorStop(0, 'rgba(255, 70, 120, 0.92)');
        glow.addColorStop(0.45, 'rgba(255, 45, 95, 0.45)');
        glow.addColorStop(1, 'rgba(255, 20, 80, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, size, size);

        ctx.save();
        ctx.translate(64, 68);
        ctx.beginPath();
        ctx.moveTo(0, 26);
        ctx.bezierCurveTo(-40, 2, -46, -30, -22, -36);
        ctx.bezierCurveTo(-8, -40, 0, -24, 0, -20);
        ctx.bezierCurveTo(0, -24, 8, -40, 22, -36);
        ctx.bezierCurveTo(46, -30, 40, 2, 0, 26);
        ctx.closePath();

        const hg = ctx.createRadialGradient(-8, -14, 4, 0, 0, 42);
        hg.addColorStop(0, '#ffd6e5');
        hg.addColorStop(0.35, '#ff4d84');
        hg.addColorStop(1, '#d1124c');
        ctx.shadowColor = '#ff2a70';
        ctx.shadowBlur = 18;
        ctx.fillStyle = hg;
        ctx.fill();
        ctx.restore();

        const tex = new THREE.CanvasTexture(c);
        tex.needsUpdate = true;
        return tex;
      }

      function createTextTexture(label) {
        const c = document.createElement('canvas');
        c.width = 560;
        c.height = 112;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, c.width, c.height);

        ctx.textBaseline = 'middle';

        ctx.shadowColor = 'rgba(255, 55, 140, 0.95)';

        ctx.fillText(label, c.width / 2, c.height / 2);

        ctx.shadowColor = 'rgba(255, 180, 215, 0.85)';

        const tex = new THREE.CanvasTexture(c);
        tex.minFilter = THREE.LinearFilter;
        tex.needsUpdate = true;

      const glowDotTex = createGlowDotTexture('rgba(255,255,255,1)', 'rgba(255,115,180,0.9)');
      const whiteDotTex = createGlowDotTexture('rgba(255,255,255,1)', 'rgba(255,220,240,0.75)');
      const softHeartTex = createSoftHeartTexture();

      // ============================================================
      // 5. BACKGROUND STARFIELD & WARP STREAK STARS
      // ============================================================
      const bgStarCount = 2600;
      const bgPositions = new Float32Array(bgStarCount * 3);

      const starPalette = [
        new THREE.Color('#ffffff'),

        bgColors[i * 3 + 1] = col.g;

      const warpCount = 900;

        warpColors[i * 3] = c.r;
        warpColors[i * 3 + 1] = c.g;
        warpColors[i * 3 + 2] = c.b;
      }
      const warpGeo = new THREE.BufferGeometry();
      warpGeo.setAttribute('position', new THREE.BufferAttribute(warpPositions, 3));
      warpGeo.setAttribute('color', new THREE.BufferAttribute(warpColors, 3));
      const warpMat = new THREE.PointsMaterial({
        size: 0.65,

      // ============================================================
      // 6. CENTRAL BLACK HOLE & LUMINOUS ACCRETION DISK
      // ============================================================
      const galaxyGroup = new THREE.Group();
      scene.add(galaxyGroup);

      const blackHole = new THREE.Mesh(
        new THREE.SphereGeometry(1.18, 40, 40),

      );
      blackHole.scale.set(1.12, 0.72, 1.12);
      galaxyGroup.add(blackHole);

      function createAccretionTexture() {
        const size = 512;
        const c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        const ctx = c.getContext('2d');
        const cx = size / 2;
        const g = ctx.createRadialGradient(cx, cx, 50, cx, cx, 250);

      const accretionDisk = new THREE.Mesh(

      // ============================================================
      // 7. SPIRAL GALAXY PARTICLE DISK (22,000 glowing stars)
      // ============================================================
      const GALAXY_COUNT = 22000;
      const ARMS = 5;
      const MAX_RADIUS = 23.5;

      const galPositions = new Float32Array(GALAXY_COUNT * 3);
      const galColors = new Float32Array(GALAXY_COUNT * 3);

      const colCore = new THREE.Color('#fff0f8');
      const colInner = new THREE.Color('#ff2e88');
      const colMid = new THREE.Color('#ff6db8');
      const colOuter = new THREE.Color('#7a1b5c');

      for (let i = 0; i < GALAXY_COUNT; i++) {
        const t = Math.pow(Math.random(), 1.35);
        const radius = 1.65 + t * (MAX_RADIUS - 1.65);
        const armIndex = i % ARMS;
        const armAngle = (armIndex / ARMS) * Math.PI * 2;
        const spinAngle = radius * 0.42;

        const scatter = (0.18 + t * 1.45);
        const rx = (Math.random() - 0.5) * scatter * 2.2;
        const rz = (Math.random() - 0.5) * scatter * 2.2;
        const ry = (Math.random() - 0.5) * (0.28 + t * 1.15) * (Math.random() < 0.7 ? 0.6 : 1.5);

        const angle = armAngle + spinAngle;
        galPositions[i * 3] = Math.cos(angle) * radius + rx;
        galPositions[i * 3 + 1] = ry;
        galPositions[i * 3 + 2] = Math.sin(angle) * radius + rz;

        const mixed = new THREE.Color();
        if (t < 0.14) {
          mixed.copy(colCore).lerp(colInner, t / 0.14);
        } else if (t < 0.52) {
          mixed.copy(colInner).lerp(colMid, (t - 0.14) / 0.38);
        } else {
          mixed.copy(colMid).lerp(colOuter, (t - 0.52) / 0.48);
        }
        if (Math.random() > 0.93) {
          mixed.lerp(colCore, 0.75);
        }
        galColors[i * 3] = mixed.r;
        galColors[i * 3 + 1] = mixed.g;
        galColors[i * 3 + 2] = mixed.b;
      }

      const galGeo = new THREE.BufferGeometry();
      galGeo.setAttribute('position', new THREE.BufferAttribute(galPositions, 3));
      galGeo.setAttribute('color', new THREE.BufferAttribute(galColors, 3));
      const galMat = new THREE.PointsMaterial({
        size: 0.32,
        map: glowDotTex,
        vertexColors: true,
        transparent: true,
        opacity: 0.92,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const galaxyPoints = new THREE.Points(galGeo, galMat);
      galaxyGroup.add(galaxyPoints);

      // ============================================================
      // 8. GIANT FLOATING 3D PARTICLE HEART ABOVE THE BLACK HOLE
      // ============================================================
      const heartCenterGroup = new THREE.Group();
      heartCenterGroup.position.set(0, 5.2, 0);
      scene.add(heartCenterGroup);

      function heartCurvePoint(t) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        return { x, y };
      }

      const outlineCount = 3600;
      const outPos = new Float32Array(outlineCount * 3);
      const outCol = new Float32Array(outlineCount * 3);
      const cWhitePink = new THREE.Color('#fff2fa');
      const cHotPink = new THREE.Color('#ff3390');
      const cSoftPink = new THREE.Color('#ff8ec6');

      for (let i = 0; i < outlineCount; i++) {
        const t = Math.random() * Math.PI * 2;
        const pt = heartCurvePoint(t);
        const scale = 0.255;
        const tubeAngle = Math.random() * Math.PI * 2;
        const tubeR = 0.06 + Math.pow(Math.random(), 0.7) * 0.32;

        outPos[i * 3] = pt.x * scale + Math.cos(tubeAngle) * tubeR * 0.7;
        outPos[i * 3 + 1] = pt.y * scale + Math.sin(tubeAngle) * tubeR * 0.7;
        outPos[i * 3 + 2] = (Math.random() - 0.5) * 0.85;

        const c = new THREE.Color().copy(cHotPink).lerp(
          Math.random() > 0.4 ? cSoftPink : cWhitePink,
          Math.random() * 0.85
        );
        outCol[i * 3] = c.r;
        outCol[i * 3 + 1] = c.g;
        outCol[i * 3 + 2] = c.b;
      }

      const outGeo = new THREE.BufferGeometry();
      outGeo.setAttribute('position', new THREE.BufferAttribute(outPos, 3));
      outGeo.setAttribute('color', new THREE.BufferAttribute(outCol, 3));
      const outMat = new THREE.PointsMaterial({
        size: 0.34,
        map: glowDotTex,
        vertexColors: true,
        transparent: true,
        opacity: 0.96,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const heartOutline = new THREE.Points(outGeo, outMat);
      heartCenterGroup.add(heartOutline);

      const innerCount = 4400;
      const inPos = new Float32Array(innerCount * 3);
      const inCol = new Float32Array(innerCount * 3);
      const cRuby = new THREE.Color('#d91668');
      const cRose = new THREE.Color('#ff5ca8');

      for (let i = 0; i < innerCount; i++) {
        const t = Math.random() * Math.PI * 2;
        const pt = heartCurvePoint(t);
        const fillFactor = Math.sqrt(Math.random()) * 0.78;
        const scale = 0.255 * fillFactor;
        const depthScale = (1 - fillFactor * 0.45) * 1.15;

        inPos[i * 3] = pt.x * scale + (Math.random() - 0.5) * 0.18;
        inPos[i * 3 + 1] = pt.y * scale + 0.15 + (Math.random() - 0.5) * 0.18;
        inPos[i * 3 + 2] = (Math.random() - 0.5) * 1.35 * depthScale;

        const c = new THREE.Color().copy(cRuby).lerp(cRose, Math.random());
        if (Math.random() > 0.88) c.lerp(cWhitePink, 0.7);
        inCol[i * 3] = c.r;
        inCol[i * 3 + 1] = c.g;
        inCol[i * 3 + 2] = c.b;
      }

      const inGeo = new THREE.BufferGeometry();
      inGeo.setAttribute('position', new THREE.BufferAttribute(inPos, 3));
      inGeo.setAttribute('color', new THREE.BufferAttribute(inCol, 3));
      const inMat = new THREE.PointsMaterial({
        size: 0.28,
        map: glowDotTex,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const heartFill = new THREE.Points(inGeo, inMat);
      heartCenterGroup.add(heartFill);

      // ============================================================
      // 9. ORBITING FLOATING GLOWING HEARTS
      // ============================================================
      const heartGroup = [];
      const FLOATING_HEARTS = 36;

      for (let i = 0; i < FLOATING_HEARTS; i++) {
        const mat = new THREE.SpriteMaterial({
          map: softHeartTex,
          transparent: true,
          opacity: 0.85,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });
        const heartMesh = new THREE.Sprite(mat);
        const s = 0.75 + Math.random() * 1.15;
        heartMesh.scale.set(s, s, 1);

        heartMesh.userData = {
          radius: 4 + Math.random() * 14,
          angle: Math.random() * Math.PI * 2,
          ySpeed: 0.006 + Math.random() * 0.012,
          yOffset: (Math.random() - 0.5) * 5.2 + 0.8,
          orbitSpeed: 0.0012 + Math.random() * 0.0022,
          phase: Math.random() * Math.PI * 2
        };

        heartMesh.position.x = Math.cos(heartMesh.userData.angle) * heartMesh.userData.radius;
        heartMesh.position.z = Math.sin(heartMesh.userData.angle) * heartMesh.userData.radius;
        heartMesh.position.y = heartMesh.userData.yOffset;

        scene.add(heartMesh);
        heartGroup.push(heartMesh);
      }

      // ============================================================
      // 10. ORBITING GLOWING ROMANTIC TEXT PHRASES
      // ============================================================
      const phraseGroup = new THREE.Group();
      scene.add(phraseGroup);
      const phraseSprites = [];

      function buildOrbitingPhrases() {
        while (phraseGroup.children.length > 0) {
          const child = phraseGroup.children[0];
          if (child.material && child.material.map) child.material.map.dispose();
          if (child.material) child.material.dispose();
          phraseGroup.remove(child);
        }
        phraseSprites.length = 0;

        const list = CONTENT[currentLang].phrases;
        list.forEach((text, i) => {
          const tex = createTextTexture(text);
          const mat = new THREE.SpriteMaterial({
            map: tex,
            transparent: true,
            opacity: 0.94,
            depthWrite: false
          });
          const sprite = new THREE.Sprite(mat);
          const ring = i % 3;
          const radius = 8.4 + ring * 4.4 + (i % 2) * 1.1;
          const angle = (i / list.length) * Math.PI * 2 + ring * 0.45;
          const y = -0.3 + (ring - 1) * 0.55 + Math.sin(i * 1.7) * 0.45;

          sprite.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
          const scaleW = 5.6 + (ring * 0.55);
          sprite.scale.set(scaleW, scaleW * (112 / 560), 1);
          sprite.userData = { baseY: y, phase: i * 0.7 };

          phraseGroup.add(sprite);
          phraseSprites.push(sprite);
        });
      }

      buildOrbitingPhrases();

      // ============================================================
      // 11. INTERACTIVE ORBITING PHOTO STICKERS (ALL 10 PHOTOS!)
      // ============================================================
      const stickerGroup = new THREE.Group();
      scene.add(stickerGroup);
      const interactiveStickers = [];
      let hoveredSticker = null;

      function createStickerSprite(imgSrc, cardIndex, orbitRadius, angleOffset, yPos) {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 296;
        const ctx = canvas.getContext('2d');

        const tex = new THREE.CanvasTexture(canvas);
        tex.minFilter = THREE.LinearFilter;

        const img = new Image();
        img.onload = function () {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const halo = ctx.createRadialGradient(128, 122, 24, 128, 122, 118);
          halo.addColorStop(0, 'rgba(255, 110, 175, 0.58)');
          halo.addColorStop(0.65, 'rgba(255, 60, 140, 0.16)');
          halo.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = halo;
          ctx.fillRect(0, 0, 256, 256);

          ctx.save();
          ctx.beginPath();
          ctx.arc(128, 122, 86, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();

          // Face-friendly top-weighted square crop
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = Math.max(0, (img.height - minSide) * 0.22);
          ctx.drawImage(img, sx, sy, minSide, minSide, 42, 36, 172, 172);
          ctx.restore();

          ctx.beginPath();
          ctx.arc(128, 122, 86, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 175, 215, 0.9)';
          ctx.lineWidth = 5;
          ctx.shadowColor = '#ff4f9a';
          ctx.shadowBlur = 16;
          ctx.stroke();

          ctx.shadowBlur = 10;
          ctx.shadowColor = 'rgba(255, 79, 154, 0.65)';
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(128, 246, 22, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#e62e6b';
          ctx.font = 'bold 22px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowBlur = 0;
          ctx.fillText('❤', 128, 248);

          tex.needsUpdate = true;
        };
        img.src = imgSrc;

        const mat = new THREE.SpriteMaterial({
          map: tex,
          transparent: true,
          depthWrite: false
        });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(2.65, 3.06, 1);
        sprite.position.set(
          Math.cos(angleOffset) * orbitRadius,
          yPos,
          Math.sin(angleOffset) * orbitRadius
        );
        sprite.userData = {
          cardIndex,
          orbitRadius,
          angle: angleOffset,
          baseY: yPos,
          baseScaleX: 2.65,
          baseScaleY: 3.06
        };

        stickerGroup.add(sprite);
        interactiveStickers.push(sprite);
      }

      IMAGES.forEach((src, i) => {
        const ring = i % 2;
        const radius = ring === 0 ? 9.6 : 14.2;
        const angle = (i / IMAGES.length) * Math.PI * 2 + ring * 0.25;
        const yPos = 1.05 + (i % 3) * 0.45;
        createStickerSprite(src, i, radius, angle, yPos);
      });

      // ============================================================
      // 12. INTERACTION: ORBIT DRAG, PINCH ZOOM, RAYCASTER CLICK
      // ============================================================
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      let isDragging = false;
      let dragDistance = 0;
      let lastX = 0;
      let lastY = 0;
      let pinchStartDist = 0;
      let pinchStartRadius = DEFAULT_ORBIT.radius;

      function updatePointerNDC(clientX, clientY) {
        pointer.x = (clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(clientY / window.innerHeight) * 2 + 1;
      }

      function checkStickerHit(clientX, clientY) {
        if (!hasEnteredUniverse || modalOpen) return null;
        updatePointerNDC(clientX, clientY);
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(interactiveStickers, false);
        return hits.length > 0 ? hits[0].object : null;
      }

      container.addEventListener('pointerdown', (e) => {
        if (!hasEnteredUniverse || modalOpen) return;
        isDragging = true;
        dragDistance = 0;
        lastX = e.clientX;
        lastY = e.clientY;
        container.classList.add('dragging');
      });

      window.addEventListener('pointermove', (e) => {
        if (!hasEnteredUniverse || modalOpen) return;
        if (isDragging) {
          const dx = e.clientX - lastX;
          const dy = e.clientY - lastY;
          dragDistance += Math.hypot(dx, dy);
          lastX = e.clientX;
          lastY = e.clientY;

          camState.targetTheta -= dx * 0.0062;
          camState.targetPhi = Math.max(0.45, Math.min(1.48, camState.targetPhi - dy * 0.0055));
        } else {
          const hit = checkStickerHit(e.clientX, e.clientY);
          hoveredSticker = hit;
          container.classList.toggle('hover-sticker', Boolean(hit));
        }
      });

      window.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        container.classList.remove('dragging');
        if (dragDistance < 8 && hasEnteredUniverse && !modalOpen) {
          const hit = checkStickerHit(e.clientX, e.clientY);
          if (hit) {
            openMemoryModal(hit.userData.cardIndex);
          }
        }
      });

      container.addEventListener('wheel', (e) => {
        if (!hasEnteredUniverse || modalOpen) return;
        e.preventDefault();
        camState.targetRadius = Math.max(10.5, Math.min(42, camState.targetRadius + e.deltaY * 0.015));
      }, { passive: false });

      container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          isDragging = false;
          pinchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          pinchStartRadius = camState.targetRadius;
        }
      }, { passive: true });

      container.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && pinchStartDist > 0) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const scale = pinchStartDist / Math.max(dist, 1);
          camState.targetRadius = Math.max(10.5, Math.min(42, pinchStartRadius * scale));
        }
      }, { passive: true });

      // ============================================================
      // 13. UI & MODAL HANDLERS
      // ============================================================
      const introOverlay = document.getElementById('intro-overlay');
      const memoryModal = document.getElementById('memory-modal');
      const galaxyHint = document.getElementById('galaxy-hint');

      let warpProgress = 0;
      let isWarping = false;

      function applyLanguage() {
        const c = CONTENT[currentLang];
        document.title = c.pageTitle;
        document.getElementById('intro-title').innerHTML = c.introTitle;
        document.getElementById('intro-subtitle').textContent = c.introSubtitle;
        document.getElementById('enter-btn').textContent = c.enterBtn;
        document.getElementById('cards-btn-label').textContent = c.cardsBtn;
        document.getElementById('volver-label').textContent = c.volverBtn;
        galaxyHint.textContent = c.hint;
        document.getElementById('lang-toggle').textContent = currentLang === 'vi' ? 'VI → EN' : 'EN → VI';

        buildOrbitingPhrases();
        if (modalOpen) renderMemoryCard(currentCardIndex);
      }

      function renderMemoryCard(index) {
        const cards = CONTENT[currentLang].cards;
        currentCardIndex = (index + cards.length) % cards.length;
        const item = cards[currentCardIndex];
        document.getElementById('memory-img').src = item.img;
        document.getElementById('memory-title').textContent = item.title;
        document.getElementById('memory-text').textContent = item.text;

        const dotsEl = document.getElementById('memory-dots');
        dotsEl.innerHTML = '';
        cards.forEach((_, idx) => {
          const dot = document.createElement('button');
          dot.type = 'button';
          dot.className = 'memory-dot' + (idx === currentCardIndex ? ' active' : '');
          dot.setAttribute('aria-label', 'Kỷ niệm ' + (idx + 1));
          dot.addEventListener('click', () => {
            playChime();
            renderMemoryCard(idx);
          });
          dotsEl.appendChild(dot);
        });
      }

      function openMemoryModal(index) {
        playChime();
        renderMemoryCard(index);
        modalOpen = true;
        memoryModal.classList.add('open');
      }

      function closeMemoryModal() {
        modalOpen = false;
        memoryModal.classList.remove('open');
      }

      document.getElementById('enter-btn').addEventListener('click', () => {
        hasEnteredUniverse = true;
        isWarping = true;
        warpProgress = 0;
        introOverlay.classList.add('hidden-out');
        startMusic();

        camState.targetRadius = DEFAULT_ORBIT.radius;
        camState.targetTheta = DEFAULT_ORBIT.theta;
        camState.targetPhi = DEFAULT_ORBIT.phi;

        setTimeout(() => {
          galaxyHint.classList.add('visible');
        }, 1800);
        setTimeout(() => {
          galaxyHint.classList.remove('visible');
        }, 9000);
      });

      document.getElementById('lang-toggle').addEventListener('click', () => {
        currentLang = currentLang === 'vi' ? 'en' : 'vi';
        applyLanguage();
      });

      document.getElementById('music-toggle').addEventListener('click', () => {
        if (musicPlaying) {
          stopMusic();
        } else {
          startMusic();
        }
      });

      document.getElementById('cards-toggle').addEventListener('click', () => {
        if (!hasEnteredUniverse) {
          document.getElementById('enter-btn').click();
          setTimeout(() => openMemoryModal(0), 650);
        } else if (modalOpen) {
          closeMemoryModal();
        } else {
          openMemoryModal(currentCardIndex);
        }
      });

      document.getElementById('reset-cam').addEventListener('click', () => {
        if (!hasEnteredUniverse) return;
        camState.targetRadius = DEFAULT_ORBIT.radius;
        camState.targetTheta = DEFAULT_ORBIT.theta;
        camState.targetPhi = DEFAULT_ORBIT.phi;
      });

      document.getElementById('volver-btn').addEventListener('click', closeMemoryModal);
      document.getElementById('prev-card-btn').addEventListener('click', () => {
        playChime();
        renderMemoryCard(currentCardIndex - 1);
      });
      document.getElementById('next-card-btn').addEventListener('click', () => {
        playChime();
        renderMemoryCard(currentCardIndex + 1);
      });

      memoryModal.addEventListener('click', (e) => {
        if (e.target === memoryModal) closeMemoryModal();
      });

      window.addEventListener('keydown', (e) => {
        if (!modalOpen) return;
        if (e.key === 'Escape') closeMemoryModal();
        if (e.key === 'ArrowRight') {
          playChime();
          renderMemoryCard(currentCardIndex + 1);
        }
        if (e.key === 'ArrowLeft') {
          playChime();
          renderMemoryCard(currentCardIndex - 1);
        }
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // ============================================================
      // 14. ANIMATION LOOP
      // ============================================================
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const elapsed = clock.getElapsedTime();

        if (isWarping) {
          warpProgress += dt * 0.65;
          const posAttr = warpGeo.attributes.position;
          for (let i = 0; i < warpCount; i++) {
            let z = posAttr.getZ(i) + dt * 95;
            if (z > 65) z = -35;
            posAttr.setZ(i, z);
          }
          posAttr.needsUpdate = true;

          if (warpProgress < 0.45) {
            warpMat.opacity = Math.min(0.95, warpProgress * 2.4);
          } else {
            warpMat.opacity = Math.max(0, 1 - (warpProgress - 0.45) * 1.9);
          }
          if (warpProgress >= 1.05) {
            isWarping = false;
            warpMat.opacity = 0;
          }
        }

        if (hasEnteredUniverse && !isDragging && !modalOpen) {
          camState.targetTheta += dt * 0.085;
        }

        const damp = isWarping ? 0.045 : 0.08;
        camState.radius += (camState.targetRadius - camState.radius) * damp;
        camState.theta += (camState.targetTheta - camState.theta) * damp;
        camState.phi += (camState.targetPhi - camState.phi) * damp;
        camState.currentTargetY += (camState.targetY - camState.currentTargetY) * damp;

        camera.position.x = camState.radius * Math.sin(camState.phi) * Math.sin(camState.theta);
        camera.position.y = camState.currentTargetY + camState.radius * Math.cos(camState.phi);
        camera.position.z = camState.radius * Math.sin(camState.phi) * Math.cos(camState.theta);
        camera.lookAt(0, camState.currentTargetY, 0);

        galaxyPoints.rotation.y += dt * 0.14;
        accretionDisk.rotation.z -= dt * 0.35;
        bgStars.rotation.y += dt * 0.012;

        const beat = 1 + Math.sin(elapsed * 2.8) * 0.032 + Math.sin(elapsed * 5.6) * 0.012;
        heartCenterGroup.scale.set(beat, beat, beat);
        heartCenterGroup.rotation.y = Math.sin(elapsed * 0.45) * 0.16;
        heartCenterGroup.position.y = 5.15 + Math.sin(elapsed * 1.3) * 0.16;

        for (let i = 0; i < heartGroup.length; i++) {
          const h = heartGroup[i];
          const d = h.userData;
          d.angle += d.orbitSpeed;
          h.position.x = Math.cos(d.angle) * d.radius;
          h.position.z = Math.sin(d.angle) * d.radius;
          h.position.y = d.yOffset + Math.sin(elapsed * (1.2 + d.ySpeed * 80) + d.phase) * 0.55;
        }

        phraseGroup.rotation.y += dt * 0.075;
        for (let i = 0; i < phraseSprites.length; i++) {
          const sp = phraseSprites[i];
          sp.position.y = sp.userData.baseY + Math.sin(elapsed * 1.1 + sp.userData.phase) * 0.18;
        }

        for (let i = 0; i < interactiveStickers.length; i++) {
          const st = interactiveStickers[i];
          const d = st.userData;
          d.angle += dt * 0.082;
          st.position.x = Math.cos(d.angle) * d.orbitRadius;
          st.position.z = Math.sin(d.angle) * d.orbitRadius;
          st.position.y = d.baseY + Math.sin(elapsed * 1.6 + i * 1.2) * 0.28;

          const isHover = hoveredSticker === st;
          const targetMult = isHover ? 1.26 : 1.0;
          st.scale.x += (d.baseScaleX * targetMult - st.scale.x) * 0.14;
          st.scale.y += (d.baseScaleY * targetMult - st.scale.y) * 0.14;
        }

        renderer.render(scene, camera);
      }

      applyLanguage();
      animate();
    })();
  </script>
</body>
</html>
